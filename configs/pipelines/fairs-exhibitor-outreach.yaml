name: fairs-exhibitor-outreach
description: >-
  Track 1 — Exhibitor Acquisition. Find companies in the show's target sector,
  enrich decision-maker contacts, qualify against the exhibitor ICP, and push
  qualified leads into LinkedIn outreach sequence.
version: "1.0"
tenant: fairs

# Configure these per show edition before running
params:
  show_name: ""                  # e.g. "Anuga 2025"
  show_sector: ""                # e.g. "food and beverage manufacturing"
  show_geography: ""             # e.g. "Europe"
  show_date: ""                  # e.g. "2025-10-04"
  show_location: ""              # e.g. "Cologne, Germany"
  target_company_size_min: 10
  target_company_size_max: 2000
  qualification_score_min: 75

steps:
  - id: find-exhibitor-prospects
    skill: find-companies
    input:
      query: "{{show_sector}} manufacturer OR supplier OR brand {{show_geography}}"
      max_results: 100
      filters:
        employee_count_min: "{{target_company_size_min}}"
        employee_count_max: "{{target_company_size_max}}"
    output: companies

  - id: find-decision-makers
    skill: find-people
    from: companies
    condition: "domain exists"
    input:
      roles:
        - Marketing Director
        - Business Development Director
        - Export Director
        - Commercial Director
        - VP Sales
        - CEO
      limit_per_company: 2
    output: contacts

  - id: enrich-contacts
    skill: enrich-leads
    from: contacts
    condition: "linkedin_url exists OR email exists"
    input:
      types: [linkedin, email]
    output: enriched

  - id: qualify-exhibitors
    skill: qualify-leads
    from: enriched
    condition: "count > 0"
    input:
      segment: seg-potential-exhibitors
      context:
        show_name: "{{show_name}}"
        show_sector: "{{show_sector}}"
        show_date: "{{show_date}}"
        show_location: "{{show_location}}"
    output: qualified

  - id: export-to-campaign
    skill: export-data
    from: qualified
    condition: "score >= {{qualification_score_min}}"
    input:
      format: json
      destination: campaign
      campaign_track: exhibitor-acquisition
      sequence:
        connect_note: >-
          Hi {{first_name}}, noticed {{company_name}} is active in {{show_sector}} —
          we're building the exhibitor lineup for {{show_name}} in {{show_location}}.
          Worth a quick chat?
        dm1_template: exhibitor-dm1
        dm2_template: exhibitor-dm2
